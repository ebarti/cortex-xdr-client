name: Test Python Package
on:
  push:
    branches:
      - master
    paths:
      - cortex_xdr_client/**
      - tests/**
      - poetry.lock
      - pyproject.toml
      - .github/workflows/python-test.yml
  pull_request:
    paths:
      - cortex_xdr_client/**
      - tests/**
      - poetry.lock
      - pyproject.toml
      - .github/workflows/python-test.yml
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e . 'pytest>=7.2,<8' 'requests-mock>=1.9,<2' 'pytest-mock>=3.10,<4'
      - name: Run tests
        run: python -m pytest -v tests
